packages:
  - web
  - office-addin

allowBuilds:
  '@azure/msal-node-extensions': false
  '@microsoft/m365agentstoolkit-cli': false
  keytar: false

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4

overrides:
  adm-zip: 0.6.1
  # Security fixes (OSV audit, 2026-10-24). All come in through the add-in's dev tooling or jsdom,
  body-parser@<1.20.9: 1.20.9
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  fast-uri@<3.1.9: 3.1.9
  qs@<6.16.1: 6.16.1
  undici@<8.12.2: 8.12.2
  '@azure/msal-node@<7.1.0': 7.1.0
  # OSV audit, 2 November 2026. Dev tooling only: the add-in's tools (axios, teamsfx, mkcert),
  # eslint, and openapi-typescript's redocly.
  follow-redirects@<1.16.2: 1.16.2
  node-forge@<1.4.1: 1.4.1
  glob@<14.0.2: 14.0.2
  minimatch@<11.0.1: 11.0.1
