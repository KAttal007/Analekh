# Production environment (design doc 22.5): pulled and started by the pipeline on the self-hosted
x-app: &app
  image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/kaushal-self/kaushal-analekh}:${IMAGE_TAG:?set IMAGE_TAG}
  env_file: /etc/analekh/production.env
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: /etc/analekh/production.env
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped

  minio:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/kaushal-self/kaushal-analekh}/minio:${IMAGE_TAG:?set IMAGE_TAG}
    command: server /data --console-address 127.0.0.1:9001
    env_file: /etc/analekh/production.env
    volumes: [minio:/data]
    restart: unless-stopped

  web:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/kaushal-self/kaushal-analekh}/web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on: [api]
    networks:
      default:
        ipv4_address: 10.89.0.10 # the only peer the API trusts for X-Forwarded-For

  caddy:
    image: caddy:2
    env_file: /etc/analekh/production.env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on: [web]

  # (http://recalc:8080), RECALC_TOKEN (at least 32 random bytes) and RECALC_FALLBACK=fail in
  recalc:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/kaushal-self/kaushal-analekh}/recalc:${IMAGE_TAG:?set IMAGE_TAG}
    env_file: /etc/analekh/production.env
    restart: unless-stopped
    networks: [recalc]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on: [postgres]

  api:
    <<: *app
    command: uvicorn analekh.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips 10.89.0.10
    ports: ["127.0.0.1:8000:8000"]
    networks: [default, recalc]
    depends_on:
      postgres: { condition: service_started }
      valkey: { condition: service_started }
      recalc: { condition: service_started }
      migrate: { condition: service_completed_successfully } # new code never meets an old schema

  worker:
    <<: *app
    command: celery -A analekh.jobs worker -l info
    networks: [default, recalc]
    depends_on: [postgres, valkey]

  beat:
    <<: *app
    command: celery -A analekh.jobs beat -l info -s /tmp/celerybeat-schedule
    depends_on: [valkey]

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24 # fixed, so the web container's address is known
          ip_range: 10.89.0.128/25 # other containers draw from here, never web's 10.89.0.10
  recalc:
    internal: true # no route out

volumes:
  pgdata:
  minio:
  caddy_data:
