# Staging environment (design doc 22.5): pulled and started by the pipeline on the self-hosted
x-app: &app
  image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/kaushal-self/kaushal-analekh}:${IMAGE_TAG:?set IMAGE_TAG}
  env_file: /etc/analekh/staging.env
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: /etc/analekh/staging.env
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped

  # (http://recalc:8080), RECALC_TOKEN (at least 32 random bytes) and RECALC_FALLBACK=fail in
  recalc:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/kaushal-self/kaushal-analekh}/recalc:${IMAGE_TAG:?set IMAGE_TAG}
    env_file: /etc/analekh/staging.env
    restart: unless-stopped
    networks: [recalc]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on: [postgres]

  api:
    <<: *app
    command: uvicorn analekh.api.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    networks: [default, recalc]
    depends_on: [postgres, valkey, migrate, recalc]

  worker:
    <<: *app
    command: celery -A analekh.jobs worker -l info
    networks: [default, recalc]
    depends_on: [postgres, valkey]

  beat:
    <<: *app
    command: celery -A analekh.jobs beat -l info
    depends_on: [valkey]

networks:
  default: {}
  recalc:
    internal: true # no route out

volumes:
  pgdata:
