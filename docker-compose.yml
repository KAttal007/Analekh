x-container-network: &container-network
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/analekh
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  RECALC_URL: http://recalc:8080
  RECALC_TOKEN: ${RECALC_TOKEN:-dev-only-recalc-token}

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: postgres -c shared_buffers=1GB -c effective_cache_size=3GB
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: analekh
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analekh"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  minio:
    build: deploy/minio
    image: analekh-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  recalc:
    build: deploy/recalc
    image: analekh-recalc:dev
    networks: [recalc]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RECALC_TOKEN: ${RECALC_TOKEN:-dev-only-recalc-token}
      RECALC_TIMEOUT_SECONDS: ${RECALC_TIMEOUT_SECONDS:-180}
      RECALC_CONCURRENCY: ${RECALC_CONCURRENCY:-2}
      RECALC_MAX_BYTES: ${MAX_UPLOAD_CEILING_BYTES:-104857600}

  api:
    build: .
    image: analekh-app:dev
    command: uvicorn analekh.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: *container-network
    ports: ["8000:8000"]
    volumes: ["./import:/app/import"]
    networks: [default, recalc]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
      recalc: { condition: service_started }

  worker:
    image: analekh-app:dev
    command: celery -A analekh.jobs worker -l info
    env_file: .env
    environment: *container-network
    volumes: ["./import:/app/import"]
    networks: [default, recalc]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  beat:
    image: analekh-app:dev
    command: celery -A analekh.jobs beat -l info -s /tmp/celerybeat-schedule
    env_file: .env
    environment: *container-network
    depends_on: [redis]

  web:
    build: { context: ., dockerfile: web/Dockerfile } # pnpm workspace lives at the root
    ports: ["5173:80"]
    depends_on: [api]

networks:
  default: {}
  recalc:
    internal: true # no route out: the recalc service cannot reach the internet or the data stores

volumes:
  pgdata:
  minio:
  redisdata:
