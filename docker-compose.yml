# Inside Docker the services reach each other by name. .env is also read by runs on the host
# (uvicorn, the CLI), where those names don't resolve, so .env holds 127.0.0.1 addresses and the
# containers get these instead (`environment` outranks `env_file`).
x-container-network: &container-network
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/analekh
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000

services:
  postgres:
    image: pgvector/pgvector:pg16
    # The facts table is ~4.4 GB; the 128 MB default made the first view of each company hit disk.
    command: postgres -c shared_buffers=1GB -c effective_cache_size=3GB
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: analekh
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analekh"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    # Built from source (deploy/minio/Dockerfile): MinIO no longer publishes community images.
    build: deploy/minio
    image: analekh-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  api:
    build: .
    command: uvicorn analekh.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: *container-network
    ports: ["8000:8000"]
    volumes: ["./import:/app/import"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  worker:
    build: .
    command: celery -A analekh.jobs worker -l info
    env_file: .env
    environment: *container-network
    volumes: ["./import:/app/import"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  beat:
    build: .
    command: celery -A analekh.jobs beat -l info -s /tmp/celerybeat-schedule
    env_file: .env
    environment: *container-network
    depends_on: [redis]

  web:
    build: { context: ., dockerfile: web/Dockerfile } # pnpm workspace lives at the root
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
