# Analekh pipeline (design doc 22.5, Appendix F).

stages: [lint, test, build, scan, deploy-staging, dast, release, mirror]

variables:
  GIT_DEPTH: "0" # full history, required for the mirror push
  UV_NO_SYNC: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  UV_HTTP_TIMEOUT: "120"
  UV_HTTP_RETRIES: "5"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Security/DAST.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # avoid duplicate branch + MR pipelines
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

.py:
  image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
  retry:
    max: 2
    when: [script_failure, stuck_or_timeout_failure, runner_system_failure]
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache, .venv]
  before_script:
    - |
      if [ -f uv.lock ]; then
        uv sync --frozen
      else
        uv venv && uv pip install -r requirements-dev.txt && uv pip install --no-deps -e .
      fi

lint:
  extends: .py
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy analekh

unit_and_integration:
  extends: .py
  stage: test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: analekh
    DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/analekh
    TEST_DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/analekh_test
    REDIS_URL: redis://redis:6379/0
  script:
    - uv run alembic upgrade head
    - uv run alembic check
    - uv run pytest --junitxml=report.xml --cov=analekh --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

web:
  stage: test
  image: node:24.22.1-alpine
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - npm install -g "$(node -p "require('./package.json').packageManager")"
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm test
    - pnpm build # web app and Excel task pane

dependency_audit:
  stage: test
  image:
    name: ghcr.io/google/osv-scanner:v2.7.0
    entrypoint: [""]
  allow_failure: true # findings show as a warning, like the other security scanners
  script:
    - /osv-scanner scan source --lockfile uv.lock --lockfile pnpm-lock.yaml

golden_set:
  extends: .py
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
  allow_failure: true
  script:
    - uv run analekh golden-test --report golden.json
  artifacts:
    paths: [golden.json]
    expire_in: 30 days

build_image:
  stage: build
  tags: [india]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker build -t "$CI_REGISTRY_IMAGE/recalc:$CI_COMMIT_SHA" deploy/recalc
    - docker push "$CI_REGISTRY_IMAGE/recalc:$CI_COMMIT_SHA"
    - docker build -f web/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - docker build -t "$CI_REGISTRY_IMAGE/minio:$CI_COMMIT_SHA" deploy/minio
    - docker push "$CI_REGISTRY_IMAGE/minio:$CI_COMMIT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        for name in "" /recalc /web /minio; do
          docker tag "$CI_REGISTRY_IMAGE$name:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE$name:$CI_COMMIT_TAG"
          docker push "$CI_REGISTRY_IMAGE$name:$CI_COMMIT_TAG"
        done
      fi

container_scanning:
  stage: scan
  needs: [build_image]
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

container_scanning_recalc:
  extends: container_scanning
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE/recalc:$CI_COMMIT_SHA

deploy_staging:
  stage: deploy-staging
  tags: [india] # self-hosted runner on the Indian VM
  environment: { name: staging, url: $STAGING_URL }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_URL
  script:
    - IMAGE_TAG=$CI_COMMIT_SHA docker compose -f deploy/compose.staging.yml pull
    - IMAGE_TAG=$CI_COMMIT_SHA docker compose -f deploy/compose.staging.yml up -d

dast:
  stage: dast
  variables:
    DAST_TARGET_URL: $STAGING_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_URL

deploy_production:
  stage: release
  tags: [india]
  environment: { name: production, url: $PRODUCTION_URL }
  rules:
    - if: $CI_COMMIT_TAG && $PRODUCTION_URL
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_URL
      when: manual
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMAGE_TAG=$CI_COMMIT_SHA docker compose -f deploy/compose.production.yml pull
    # A changed network is recreated by `up`, but containers it only re-attaches (postgres, valkey)
    # lose their service-name aliases and stop resolving (seen 2026-10-29). Take the stack down
    # first when the live subnet differs from the compose file; volumes are kept.
    - |
      export IMAGE_TAG=$CI_COMMIT_SHA
      want=$(docker compose -f deploy/compose.production.yml config | grep -m1 'subnet:' | awk '{print $2}')
      have=$(docker network inspect deploy_default -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null || true)
      if [ -n "$have" ] && [ "$have" != "$want" ]; then
        echo "network subnet changed ($have -> $want): taking the stack down first"
        docker compose -f deploy/compose.production.yml down
      fi
    - IMAGE_TAG=$CI_COMMIT_SHA docker compose -f deploy/compose.production.yml up -d --remove-orphans
    - docker image prune -f

mirror_to_github:
  stage: mirror
  image:
    name: alpine/git:latest
    entrypoint: [""] # the image's entrypoint is `git`; the runner needs a shell
  resource_group: github-mirror
  rules:
    - if: $GITHUB_MIRROR_TOKEN == null || $GITHUB_MIRROR_TOKEN == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - REMOTE="https://${GITHUB_MIRROR_USER}:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPO}.git"
    - if [ -n "$CI_COMMIT_TAG" ]; then git push "$REMOTE" "refs/tags/$CI_COMMIT_TAG"; else git push "$REMOTE" "HEAD:refs/heads/main"; fi
