server {
  listen 80;
  root /usr/share/nginx/html;
  # Outer cap only, above the highest upload limit an admin can set (MAX_UPLOAD_CEILING_BYTES plus
  # REQUEST_BODY_OVERHEAD_BYTES). The admin's own limit is enforced by the API (413); nginx's
  # default of 1 MB would otherwise refuse larger uploads first.
  client_max_body_size 101m;
  location /api/ {
    proxy_pass http://api:8000/;
    # Caddy sets X-Forwarded-For to the real client address; pass it on unchanged so the API's
    # per-address sign-in limit counts each client (the API trusts it only from this container).
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  }
  location / { try_files $uri /index.html; }
}
